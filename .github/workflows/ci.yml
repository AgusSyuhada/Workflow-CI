name: CI-MLflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install "mlflow==2.19.0" pandas==2.2.3 scikit-learn==1.6.1

      - name: Train via MLflow Project
        run: mlflow run MLProject --experiment-name HeartDisease-CI --env-manager=local

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifacts
          path: mlruns

      - name: Build Docker image from trained model
        run: |
          MODEL_DIR=$(find mlruns -type d -name "model" | head -1)
          echo "Model dir: $MODEL_DIR"
          # Jamin template python-slim: mlflow 2.19 fallback ke template pyenv
          # (python3.9 + get-pip.py rusak) bila python_env.yaml/virtualenv hilang.
          PYVER=$(python -c "import platform; print(platform.python_version())")
          printf 'python: "%s"\nbuild_dependencies:\n  - pip\ndependencies:\n  - mlflow==2.19.0\n  - pandas==2.2.3\n  - scikit-learn==1.6.1\n' "$PYVER" > "$MODEL_DIR/python_env.yaml"
          MODEL_DIR="$MODEL_DIR" python -c "
          import os, yaml
          p = os.path.join(os.environ['MODEL_DIR'], 'MLmodel')
          m = yaml.safe_load(open(p))
          m['flavors']['python_function']['env']['virtualenv'] = 'python_env.yaml'
          yaml.safe_dump(m, open(p, 'w'))
          print('patched MLmodel env:', m['flavors']['python_function']['env'])
          "
          # --env-manager local: install dependensi model via pip langsung di image.
          # Base image python:3.12.7-slim berasal dari python_env.yaml yang dipatch di atas.
          mlflow models build-docker -m "$MODEL_DIR" --env-manager local -n "${{ secrets.DOCKER_USERNAME }}/smsml-heartdisease:latest"

      - name: Push image to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push "${{ secrets.DOCKER_USERNAME }}/smsml-heartdisease:latest"
